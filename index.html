function hashStr(s){let h=2166136261;for(let i=0;i<s.length;i++){h^=s.charCodeAt(i);h=Math.imul(h,16777619);}return h>>>0;}
function mulberry32(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296;};}
function qrSvg(payload,size=190){
const N=25,cell=size/N,rnd=mulberry32(hashStr(payload));
const g=Array.from({length:N},()=>Array(N).fill(0));
const finder=(r,c)=>{for(let i=-1;i<8;i++)for(let j=-1;j<8;j++){const rr=r+i,cc=c+j;if(rr<0||cc<0||rr>=N||cc>=N)continue;
g[rr][cc]=2;
if(i>=0&&i<7&&j>=0&&j<7){const on=(i===0||i===6||j===0||j===6||(i>=2&&i<=4&&j>=2&&j<=4));g[rr][cc]=on?1:2;}}};
finder(0,0);finder(0,N-7);finder(N-7,0);
for(let i=8;i<N-8;i++){g[6][i]=(i%2===0)?1:2;g[i][6]=(i%2===0)?1:2;}
for(let i=N-9;i<=N-5;i++)for(let j=N-9;j<=N-5;j++){const di=i-(N-7),dj=j-(N-7);
g[i][j]=(di===0||di===4||dj===0||dj===4||(di===2&&dj===2))?1:2;}
for(let r=0;r<N;r++)for(let c=0;c<N;c++)if(g[r][c]===0)g[r][c]=rnd()<0.44?1:0;
let rects='';
for(let r=0;r<N;r++)for(let c=0;c<N;c++)if(g[r][c]===1)
rects+=`<rect x="${(c*cell).toFixed(2)}" y="${(r*cell).toFixed(2)}" width="${cell.toFixed(2)}" height="${cell.toFixed(2)}" rx="${(cell*0.24).toFixed(2)}"/>`;
return `<svg viewBox="0 0 ${size} ${size}" width="${size}" height="${size}" role="img" aria-label="Simulated QR code"><g fill="var(--ink)">${rects}</g></svg>`;}

[0,.5,1].forEach(f=>{const gy=y(max*f);g+=`<line x1="${pl}" x2="${W-pr}" y1="${gy}" y2="${gy}" stroke="#E5EAF5"/><text x="${pl-8}" y="${gy+4}" text-anchor="end" font-size="11" fill="#8B96B0">${Math.round(max*f)>=1000?Math.round(max*f/100)/10+'k':Math.round(max*f)}</text>`;});

function smoothPath(pts){let d=`M ${pts[0][0].toFixed(1)} ${pts[0][1].toFixed(1)}`;
for(let i=0;i<pts.length-1;i++){const p0=pts[Math.max(0,i-1)],p1=pts[i],p2=pts[i+1],p3=pts[Math.min(pts.length-1,i+2)];
d+=` C ${(p1[0]+(p2[0]-p0[0])/6).toFixed(1)} ${(p1[1]+(p2[1]-p0[1])/6).toFixed(1)}, ${(p2[0]-(p3[0]-p1[0])/6).toFixed(1)} ${(p2[1]-(p3[1]-p1[1])/6).toFixed(1)}, ${p2[0].toFixed(1)} ${p2[1].toFixed(1)}`;}return d;}
function trendChart(pts){const W=640,H=232,pl=48,pr=14,pt=30,pb=30;
const max=niceMax(Math.max(...pts.map(p=>p.v),10));const iw=W-pl-pr,ih=H-pt-pb;
const X=i=>pl+iw*(i/(pts.length-1)),Y=v=>pt+ih*(1-v/max);let g='';
[0,.5,1].forEach(f=>{const gy=Y(max*f);g+=`<line x1="${pl}" x2="${W-pr}" y1="${gy}" y2="${gy}" stroke="#E5EAF5"/><text x="${pl-8}" y="${gy+4}" text-anchor="end" font-size="11" fill="#8B96B0">${Math.round(max*f)>=1000?Math.round(max*f/100)/10+'k':Math.round(max*f)}</text>`;});
const P=pts.map((p,i)=>[X(i),Y(p.v)]),line=smoothPath(P);
g+=`<path d="${line} L ${X(pts.length-1)} ${Y(0)} L ${X(0)} ${Y(0)} Z" fill="rgba(59,91,219,.1)"/><path d="${line}" fill="none" stroke="var(--blue)" stroke-width="3" stroke-linecap="round"/>`;

const lp=pts[pts.length-1];
g+=`<text x="${X(pts.length-1)-4}" y="${Y(lp.v)-14}" text-anchor="end" font-size="12.5" font-weight="700" fill="var(--ink)">$${lp.v>=1000?(lp.v/1000).toFixed(1)+'k':Math.round(lp.v)}</text>`;
return `<svg viewBox="0 0 ${W} ${H}" style="width:100%;height:auto" role="img" aria-label="Monthly spending trend">${g}</svg>`;}
function donutChart(cats,total){const C=2*Math.PI*64;let acc=0,g='';
cats.forEach(c=>{const frac=total?c.v/total:0,len=Math.max(.5,frac*C-2.5);

function sendResults(q){q=q.trim().toLowerCase();const pool=[...db.users.filter(u=>u.id!==me().id),...db.contacts];

function insData(){const my=me(),now=Date.now(),week=insState.seg==='week';
const win=week?7:183;
const cur=db.tx.filter(t=>t.uid===my.id&&t.status==='completed'&&now-t.date<=win*864e5+36e5);
const prev=db.tx.filter(t=>{const age=now-t.date;return t.uid===my.id&&t.status==='completed'&&age>win*864e5&&age<=win*2*864e5;});
const sumOut=arr=>arr.filter(t=>t.dir==='out').reduce((s,t)=>s+t.amount+(t.kind==='payment'&&t.payType==='ff'?t.fee||0:0),0);
const sumIn=arr=>arr.filter(t=>t.dir==='in').reduce((s,t)=>s+t.amount,0);
const out=sumOut(cur),inn=sumIn(cur),pOut=sumOut(prev);
const days=[];
if(week)for(let i=6;i>=0;i--){const d=new Date();d.setDate(d.getDate()-i);
const lbl=d.toLocaleDateString('en-US',{weekday:'short'}).slice(0,2);
const v=cur.filter(t=>t.dir==='out'&&new Date(t.date).toDateString()===d.toDateString()).reduce((s,t)=>s+t.amount+(t.kind==='payment'&&t.payType==='ff'?t.fee||0:0),0);
days.push({lbl,out:v});}
const months=[];
if(!week)for(let i=5;i>=0;i--){const d=new Date();d.setMonth(d.getMonth()-i);
const m=d.toLocaleDateString('en-US',{month:'short'});
const v=cur.filter(t=>{const td=new Date(t.date);return t.dir==='out'&&td.getMonth()===d.getMonth()&&td.getFullYear()===d.getFullYear();}).reduce((s,t)=>s+t.amount+(t.kind==='payment'&&t.payType==='ff'?t.fee||0:0),0);
months.push({m,v});}
const catMap={};
cur.filter(t=>t.dir==='out').forEach(t=>{const k=t.kind==='withdrawal'?'withdrawal':(t.cat||'transfer');catMap[k]=(catMap[k]||0)+t.amount;});
const cats=Object.entries(catMap).map(([k,v])=>({k,v,c:(CATS[k]||{}).c||'#3B5BDB',label:(CATS[k]||{}).label||k})).sort((a,b)=>b.v-a.v);
const people={};cur.filter(t=>t.dir==='out'&&t.cp&&t.cp.id&&!t.cp.bank).forEach(t=>{people[t.cp.id]=people[t.cp.id]||{cp:t.cp,v:0,n:0};people[t.cp.id].v+=t.amount;people[t.cp.id].n++;});
const top=Object.values(people).sort((a,b)=>b.v-a.v).slice(0,4);
const delta=(pOut>0)?Math.round((out-pOut)/pOut*100):null;
return{out,inn,net:inn-out,pOut,delta,days,months,cats,top,count:cur.length};}
function narrateInsights(d){
const L=[];
const top=d.cats[0];
if(top&&d.out>0)L.push(`${top.label} is your biggest category — ${Math.round(top.v/d.out*100)}% of spending (${fmt(top.v)}).`);
if(d.delta!==null&&Number.isFinite(d.delta))L.push(d.delta>0
?`Spending is up ${d.delta}% vs the previous period (${fmt(d.pOut)} → ${fmt(d.out)}).`
:`Spending is down ${Math.abs(d.delta)}% vs the previous period — nice pullback.`);

function securityReasons(cp,amountC){const my=me(),r=[],sens=my.settings.secSens||'standard';
if(amountC>=100000)r.push(`Unusual size: ${fmt(amountC/100)} is much larger than your typical payment`);
const prior=db.tx.some(t=>t.cp&&t.cp.id===cp.id&&t.status==='completed'&&t.kind==='payment');
if(!prior&&amountC>=50000&&sens!=='low')r.push(`New relationship: this is your first payment to ${cp.name}`);
const recent=db.tx.filter(t=>t.uid===my.id&&t.dir==='out'&&t.kind==='payment'&&t.status==='completed'&&Date.now()-t.date<6e5).length;
if(recent>=2)r.push(`Velocity: ${recent+1} payments in the last 10 minutes`);
const hr=new Date().getHours();
if((hr>=0&&hr<5)&&amountC>=20000)r.push(`Odd hour: it's ${tLabel(Date.now())} — payments at this time are rare for you`);
if(cp.id==='u_nina')r.push('Risk signal: this recipient was flagged in a previous report');
if(sens==='high'&&amountC>=30000)r.push('Policy: security checks are set to High sensitivity');
return r;}
function validateSend(){const f=flowSend,m=methodById(f.methodId);let msg='';
const bal=Math.round(me().balance*100);
if(f.c<50)msg='Minimum payment is $0.50.';
else if(m.type==='wallet'&&f.payIn4&&Math.round(f.c/4)>bal)msg='Insufficient balance for the first Pay in 4 installment — add money or use a card.';
else if(m.type==='wallet'&&f.c>bal)msg='Insufficient balance — add money or pay with a linked card.';
else if(m.type==='card'&&f.c>200000)msg='Card payments are capped at $2,000 in this demo.';
if(msg){const p=$('#amt-err');
if(p){p.textContent=msg;p.style.display='block';const a=$('#amt');if(a){a.style.animation='shake .4s ease';setTimeout(()=>{const x=$('#amt');if(x)x.style.animation='';},450);}}
else toast(msg,'error');}
return !msg;}
function accrueSavings(){const u=me();if(!u)return;
const s=u.savings||(u.savings={amt:0,last:Date.now()});
const days=(Date.now()-(s.last||Date.now()))/864e5;
if(days<0.02||s.amt<=0){s.last=Date.now();return;}
const interest=Math.round(s.amt*0.043*days*100)/100;
if(interest>=0.01){s.amt+=interest;
notify('deposit','Savings interest',`+${fmt(interest)} accrued over ${days<1?Math.round(days*24)+' hours':Math.round(days)+' days'} at 4.30% APY (simulated).`);}
s.last=Date.now();save();}
function completeSend(ppRef){const f=flowSend,q=feeQuote(f.payType,f.methodId,f.c),u=me();
const nm=f.to.name,amt=f.c/100,nt=f.note;
const inst=Math.round(f.c/4);
let cashback=0;
if(f.payType==='gns')cashback=Math.round(f.c*0.01)/100;
const tx={id:uid('tx'),uid:u.id,kind:'payment',dir:'out',amount:q.youPay/100,fee:q.fee/100,payType:f.payType,cp:{...f.to},cat:f.payType==='gns'?'shopping':'transfer',note:nt,status:'completed',date:Date.now(),method:f.methodId,extra:{settled:true,protect:f.payType==='gns',theyGet:q.theyGet/100,stripeRef:ppRef?ppRef.ref:null,threeDS:!!(ppRef&&ppRef.stepUp),payIn4:f.payIn4?{total:f.c/100}:null,cashback}};
if(f.methodId==='wallet')u.balance-=(f.payIn4?inst:q.youPay)/100;
if(cashback)u.balance+=cashback;
if(f.requestId){const r=db.reqs.find(x=>x.id===f.requestId);if(r){r.status='paid';r.paidAt=Date.now();const rt=db.tx.find(t=>t.reqId===r.id);if(rt)rt.status='completed';}}
if(f.payIn4){db.plans=db.plans||[];
db.plans.push({id:uid('pl'),txId:tx.id,to:nm,note:nt,total:f.c/100,inst:inst/100,method:f.methodId,
remaining:[1,2,3].map(i=>({n:i+1,amt:inst/100,due:Date.now()+i*14*864e5,paid:false}))});}
db.tx.unshift(tx);save();
toast(f.payIn4?`Paid ${fmt(inst/100)} of 4 — ${fmt(amt)} to ${nm}`:`Sent ${fmt(amt)} to ${nm}`,'success');
successView={txId:tx.id};flowSend=freshSend();navTo('success');
setTimeout(()=>{if(!db.session)return;
notify('payment',`Delivered to ${nm}`,`${fmt(amt)} payment${nt?` “${nt}”`:''} was delivered (simulated receipt).`,tx.id);
refreshIfVisible();},4000);
if(Math.random()<0.55){
setTimeout(()=>{if(!db.session)return;
const reply=['Thanks so much! 🙏','Got it — appreciate you!','You’re the best, thank you!','Perfect timing, thanks!','Thank you!! 🎉'][Math.floor(Math.random()*5)];
showBanner(nm,`“${esc(reply)}” — reply to your ${fmt(amt)} payment (simulated).`);
notify('payment',`Message from ${nm}`,`“${reply}”`,tx.id);
toast(`${nm}: “${reply}”`,'info');
refreshIfVisible();},9000+Math.random()*6000);}}
async function holdComplete(){
const f=flowSend;if(!f.to||!validateSend())return;
const reasons=securityReasons(f.to,f.c);
let proceed=true;
if(reasons.length)proceed=await securityHold(reasons,f.c/100,f.to);
if(!proceed){const tx={id:uid('tx'),uid:me().id,kind:'payment',dir:'out',amount:f.c/100,fee:0,payType:f.payType,cp:{...f.to},cat:'transfer',note:f.note,status:'declined',date:Date.now(),method:f.methodId,extra:{autoBlocked:true}};
db.tx.unshift(tx);save();
notify('security','Security check stopped a payment',`${fmt(f.c/100)} to ${f.to.name} was cancelled after you declined the review.`,tx.id);
toast('Payment cancelled by security check','security');
flowSend=freshSend();navTo('home');return;}
if(reasons.length)notify('security','Security check passed',`You confirmed the ${fmt(f.c/100)} payment to ${f.to.name}.`);
runProcessing(['Verifying your account (mock)','Running security checks','Settling to '+f.to.name]).then(()=>completeSend(null));}

let holdRAF=null,holdStart=0;
function startHold(btn){
if(RM){holdComplete();return;}
btn.classList.add('holding');holdStart=performance.now();
const fg=btn.querySelector('.ring-fg');
const tick=t=>{const pr=Math.min(1,(t-holdStart)/900);
if(fg)fg.style.strokeDashoffset=String(289.03*(1-pr));
if(pr>=1){endHold(btn);holdComplete();return;}
holdRAF=requestAnimationFrame(tick);};
holdRAF=requestAnimationFrame(tick);}
function endHold(btn){if(holdRAF)cancelAnimationFrame(holdRAF);holdRAF=null;
btn.classList.remove('holding');const fg=btn.querySelector('.ring-fg');if(fg)fg.style.strokeDashoffset='289.03';}

function aiParsePay(text){
const t=text.trim();if(t.length<4)return;
const amtM=t.match(/\$?\s*(\d+(?:\.\d{1,2})?)/);
const amountC=amtM?Math.round(parseFloat(amtM[1])*100):null;
const q=t.toLowerCase();
const person=[...db.users.filter(u=>u.id!==me().id),...db.contacts]
.find(u=>q.includes(u.name.toLowerCase())||q.includes(u.name.toLowerCase().split(' ')[0]));
const gns=/(buy|purchase|order|pay for|service|goods|invoice)/.test(q);
const noteM=t.match(/for\s+(.+?)(?:\s+on\s+\w+)?$/i);
if(person&&amountC&&amountC>=50){
flowSend=freshSend();
flowSend.to={id:person.id,name:person.name,email:person.email||''};
flowSend.c=amountC;flowSend.note=noteM?noteM[1].trim():'';
flowSend.payType=gns?'gns':'ff';
flowSend.step='amount';stack=[{page:'send'}];renderApp();
toast(`✦ Parsed: ${fmt(amountC)} to ${person.name}${gns?' · G&S':''}${flowSend.note?` · “${flowSend.note}”`:''}`,'info');}
else if(t.length>=6)toast('✦ Try: “pay <name> <amount> for <what>”','info');}

if(y){const u=me();u.devices=u.devices.filter(d=>d.id!==el.dataset.id);save();renderApp();toast('Device logged out','info');}});break;
case 'signout-all':confirmDialog({title:'Log out all other devices?',body:'Every other session will be ended (simulated).',ok:'Log out all',danger:true}).then(y=>{
if(y){const u=me();u.devices=u.devices.filter(d=>d.cur);save();renderApp();toast('Other devices logged out','security');}});break;
case 'acc':el.closest('.acc').classList.toggle('open');break;
case 'pay-req':{const r=db.reqs.find(x=>x.id===el.dataset.id);if(!r)break;
const from=userById(r.from);
flowSend=freshSend();flowSend.to={id:from.id,name:from.name,email:from.email||''};flowSend.requestId=r.id;
flowSend.c=Math.round(r.amount*100);flowSend.note=r.note;flowSend.step='amount';
stack=[{page:'send'}];renderApp();
toast(`Paying ${from.name.split(' ')[0]}’s request of ${fmt(r.amount)}`,'info');break;}
case 'decline-req':confirmDialog({title:'Decline this request?',body:'They won’t be able to charge you (simulated).',ok:'Decline',danger:true,icon:'x-circle'}).then(y=>{
if(y){const r=db.reqs.find(x=>x.id===el.dataset.id);if(r){r.status='declined';
const rt=db.tx.find(t=>t.reqId===r.id);if(rt)rt.status='declined';save();}
toast('Request declined','info');renderApp();}});break;
case 'remind-req':{const r=db.reqs.find(x=>x.id===el.dataset.id);
if(r){const to=userById(r.to);
showBanner('Messages',`To ${esc(to?to.name:'recipient')}: “Friendly reminder about the ${fmt(r.amount)} request${r.note?` for “${esc(r.note)}”`:''}” (simulated outbound).`);
if(to&&Math.random()<0.6)simRequestResponse(r,6000+Math.random()*5000);}
toast('Reminder sent (simulated)','info');break;}
case 'cancel-req':confirmDialog({title:'Cancel your request?',body:'The request will be withdrawn.',ok:'Cancel request',danger:true}).then(y=>{
if(y){const r=db.reqs.find(x=>x.id===el.dataset.id);if(r){r.status='cancelled';
const rt=db.tx.find(t=>t.reqId===r.id);if(rt)rt.status='cancelled';save();}
toast('Request cancelled','info');renderApp();}});break;
case 'rc-amt':receiveAmtC=parseInt(el.dataset.v,10)||0;renderApp();break;
case 'rc-share':{const url=payLink();const text=`Pay me on PayWallet (mock demo): ${url}`;
if(navigator.share){navigator.share({title:'PayWallet (mock demo) — pay me',text,url}).catch(err=>{if(err&&err.name!=='AbortError')shareSheet(text,url);});}
else shareSheet(text,url);break;}
case 'sh-send':{const app=el.dataset.app;const url=payLink();closeModal();
showBanner(app,`To ${esc(app)}: “Pay me: ${esc(url)}” (simulated outbound share).`);
toast(`Shared via ${app} (simulated)`,'success');break;}
case 'sh-copy':copyText(payLink(),'Link copied');closeModal();break;
case 'friends-sync':friendsSyncing=true;renderApp();
setTimeout(()=>{friendsSyncing=false;db.contactsSynced=true;save();renderApp();
toast(`${matchContacts().on.length} contacts matched (simulated)`,'success');},1200);break;
case 'friends-reset':db.contactsSynced=false;save();renderApp();break;
case 'invite-cp':{const name=el.dataset.name,key=el.dataset.id;
if(!db.invites)db.invites=[];if(!db.invites.includes(key))db.invites.push(key);save();
showBanner('Messages',`Invite sent to <b>${esc(name)}</b>: “Join me on PayWallet (mock) — ${esc(payLink())}” (simulated).`);
toast(`Invite sent to ${esc(name)}`,'success');renderApp();break;}
}}catch(err){toast('Something went wrong: '+(err&&err.message||'unknown'),'error');console.error(err);}
});

document.addEventListener('input',e=>{
const el=e.target.closest('[data-input]');if(!el)return;
const k=el.dataset.input;
if(k==='send-search'){sendQuery=el.value;const r=$('#send-results');if(r)r.innerHTML=sendResults(el.value);}
if(k==='rq-search'){rqQuery=el.value;const r=$('#rq-results');if(r)r.innerHTML=rqResults(el.value);}
if(k==='act-search'){actFilter.q=el.value;const r=$('#act-list');if(r)r.innerHTML=activityListHTML();}
if(k==='send-note')flowSend.note=el.value;
if(k==='rq-note')flowReq.note=el.value;
if(k==='reg-pw'){const s=pwScore(el.value);const box=$('#pw-str');
if(box){box.className='strength s'+s;box.querySelector('em').textContent=s?pwWord[s]:'—';}}
});
document.addEventListener('keydown',e=>{
const aiEl=e.target.closest('[data-input="ai-cmd"]');if(!aiEl)return;
if(e.key==='Enter')aiParsePay(aiEl.value);});
document.addEventListener('change',e=>{
const sel=e.target.closest('[data-filter]');if(sel&&sel.tagName==='SELECT'){
actFilter[sel.dataset.filter]=sel.value;const r=$('#act-list');if(r)r.innerHTML=activityListHTML();}});
document.addEventListener('submit',e=>{
const form=e.target.closest('[data-form]');if(!form)return;e.preventDefault();
const kind=form.dataset.form;
if(kind==='login'){
clearErrs(form);
const id=form.id.value.trim().toLowerCase(),pw=form.pw.value;
if(!id){setErr(form,'id','Enter your email or mobile number.');return;}
if(!pw){setErr(form,'pw','Enter your password.');return;}
const u=db.users.find(x=>(x.email||'').toLowerCase()===id||digits(x.phone)===digits(id));
if(!u||!u.password){setErr(form,'id','No account found. Try the demo account below.');return;}
if(u.password!==btoa(pw)){setErr(form,'pw','Incorrect password. (Demo hint: demo1234)');return;}
if(u.settings.twofa){authUser=u;authCode=genCode();authMode='2fa';
showBanner('Messages',`PayWallet: Your security code is <b>${authCode}</b>. Never share this code.`);
renderApp();return;}
startSession(u);}
if(kind==='twofa-login'){
clearErrs(form);
const code=form.code.value.trim();
if(!/^\d{6}$/.test(code)){setErr(form,'code','Enter the 6-digit code.');return;}
if(code!==authCode){authTries++;setErr(form,'code',authTries>=3?'Too many attempts — resend the code.':'Incorrect code. Check the simulated SMS banner.');return;}
startSession(authUser);authUser=null;authMode='login';authTries=0;}
if(kind==='register'){
clearErrs(form);let ok=true;
const name=form.name.value.trim(),email=form.email.value.trim(),phone=form.phone.value.trim(),pw=form.pw.value;
if(name.length<2){setErr(form,'name','Enter your name.');ok=false;}
if(!/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(email)){setErr(form,'email','Enter a valid email.');ok=false;}
else if(db.users.some(x=>(x.email||'').toLowerCase()===email.toLowerCase())){setErr(form,'email','That email already has an account.');ok=false;}
if(digits(phone).length<7){setErr(form,'phone','Enter a valid mobile number.');ok=false;}
if(pwScore(pw)<2){setErr(form,'pw','Password too weak — use 8+ chars with mixed characters.');ok=false;}
if(!form.terms.checked){setErr(form,'terms','Please acknowledge the demo notice.');ok=false;}
if(!ok)return;
const u={id:uid('u'),name,email,phone,color:AV_COLORS[Math.floor(Math.random()*AV_COLORS.length)],joined:new Date().toISOString().slice(0,10),verified:false,password:btoa(pw),balance:0,savings:{amt:0,last:Date.now()},
settings:{twofa:false,loginAlerts:true,secSens:'standard',guideDismissed:false,notif:{payments:true,requests:true,deposits:true,security:true,marketing:false}},
methods:[],devices:[{id:uid('d'),name:'This browser',cur:true}]};
db.users.push(u);save();
startSession(u);
showBanner('Messages',`Welcome to PayWallet (mock), ${esc(name.split(' ')[0])}! Try the ✦ bar: “pay jordan 25 for pizza”.`);}
if(kind==='edit-profile'){
clearErrs(form);let ok=true;
const name=form.name.value.trim();
if(name.length<2){setErr(form,'name','Enter your name.');ok=false;}
if(!/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(form.email.value.trim())){setErr(form,'email','Enter a valid email.');ok=false;}
if(!ok)return;
const u=me();u.name=name;u.email=form.email.value.trim();u.phone=form.phone.value.trim();
if(editColor)u.color=editColor;save();
toast('Profile updated','success');back();}
if(kind==='contact'){
clearErrs(form);let ok=true;
if(!/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(form.email.value.trim())){setErr(form,'email','Enter a valid email.');ok=false;}
if(!form.topic.value){setErr(form,'topic','Choose a topic.');ok=false;}
if(form.msg.value.trim().length<10){setErr(form,'msg','Tell us a bit more (10+ characters).');ok=false;}
if(!ok)return;
const btn=form.querySelector('button[data-busy]');withBusy(btn,'Sending…',()=>{
runProcessing(['Routing to support (mock)','Creating your case']).then(()=>{
openModal(`<div class="dlg"><div class="dlg-ic">${icf('headset')}</div><h3>Case created</h3>
<p>Your reference is <b class="mono">PW-${Math.random().toString(36).slice(2,6).toUpperCase()}</b>. This is a simulated reply — no real support queue exists.</p>
<div class="dlg-btns"><button class="btn btn-primary btn-block" data-action="close-modal-btn" style="grid-column:1/-1">Done</button></div></div>`);
toast('Support case opened (simulated)','success');});});}
});

(function boot(){
try{
const raw=store.get(KEY);
let parsed=null;
if(raw){try{parsed=JSON.parse(raw);}catch(e){parsed=null;}}
db=(parsed&&parsed.v===1)?parsed:seed();
db.settings=db.settings||{hideBalance:false};
db.flags=db.flags||{actNew:false};
if(!Array.isArray(db.plans))db.plans=[];
if(!Array.isArray(db.invites))db.invites=[];
if(typeof db.contactsSynced!=='boolean')db.contactsSynced=false;
if(!db.phishState)db.phishState={seen:0,correct:0,drills:[]};
save();
renderApp();
window.addEventListener('error',ev=>{
if(db&&$('#toasts'))toast('Something went wrong: '+(ev.message||'unknown'),'error');});
}catch(err){
const app=document.getElementById('app');
app.innerHTML=`<div style="min-height:100vh;display:grid;place-items:center;padding:20px;font-family:system-ui,sans-serif">
<div style="max-width:440px;text-align:center;background:#fff;border:1px solid #E3E7F2;border-radius:20px;padding:28px;box-shadow:0 10px 28px -14px rgba(59,91,219,.2)">
<h2 style="margin:0 0 8px">Hit a snag</h2>
<p style="color:#5C6885;font-size:14px;word-break:break-word">${esc(String(err&&err.message||err))}</p>
<button onclick="location.reload()" style="margin-top:16px;padding:10px 18px;border-radius:12px;background:#3B5BDB;color:#fff;border:none;font-weight:600;cursor:pointer">Reload</button></div></div>`;}
})();
</script>
</body>
